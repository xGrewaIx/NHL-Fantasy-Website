[project]
name = "nhl-fantasy-stats-website"
version = "0.1.0"
description = "End-to-end NHL analytics and fantasy hockey platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "streamlit>=1.40,<2.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "httpx[http2]>=0.28.1",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx2",
    "ruff>=0.8,<1.0",
]

# Ruff configuration
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "data",
    "artifacts",
]

# linting configuration
# https://docs.astral.sh/ruff/linter/#rule-selection 
[tool.ruff.lint]
select = [ 
    "E", 
    "F", 
    "I", 
    "B", 
    "UP",
]

# pytest configuration
# https://docs.pytest.org/en/7.1.x/explanation/goodpractices.html
# https://docs.pytest.org/en/stable/reference/customize.html 
# https://docs.pytest.org/en/stable/reference/reference.html#ini-options-ref
[tool.pytest.ini_options] # 
testpaths = ["tests"] # specify the directory where the test files are located
pythonpath = ["."] # List of directories added to python search path to find "tests" directory
addopts = "-q" # quiet output (concise output)
